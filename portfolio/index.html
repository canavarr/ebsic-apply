<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | EBS Investment Club</title>
<meta name="description" content="The EBS Investment Club portfolio: holdings, allocation and return since entry, with live prices.">
<meta name="theme-color" content="#001F4C">
<meta name="color-scheme" content="light">

<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../assets/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

<link rel="preload" href="../assets/fonts/ZinDisplayCond-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="../assets/fonts/Montserrat-Medium.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face{ font-family:"Zin Display Cond"; src:url("../assets/fonts/ZinDisplayCond-Medium.otf") format("opentype"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Montserrat"; src:url("../assets/fonts/Montserrat-Medium.ttf") format("truetype"); font-weight:500; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Montserrat"; src:url("../assets/fonts/Montserrat-SemiBold.ttf") format("truetype"); font-weight:600; font-style:normal; font-display:swap; }
  @font-face{ font-family:"Montserrat"; src:url("../assets/fonts/Montserrat-Bold.ttf") format("truetype"); font-weight:700; font-style:normal; font-display:swap; }

  :root{
    --navy:#001F4C; --navy-soft:#16336e; --paper:#F6F8F9; --card:#ffffff; --tint:#fafbfd;
    --pill:#F2F4F6; --pill-hover:#d9dce6; --body-soft:rgba(0,31,76,.78);
    --muted:#6b7490; --muted-strong:#5f6884; --accent-line:#dbe4f5;
    --accent:#006ACC; --accent-hover:#0058b0; --sky:#73ebc7;
    /* EBS house palette, taken from ebs.ee's own tokens. Mint is 11.1:1 on
       navy but only 1.45:1 on white, so it is a dark-surface and gradient
       colour only — never body text on paper. */
    --ebs-mint:#73ebc7; --ebs-blue-mid:#006aac;
    --ebs-mint-tint:#ebfffa; --ebs-blue-tint:#d1e6fa; --footer-email:#D9F9F7;
    --warn:#9A5C06; --warn-bg:#FFF6E6;
  }

  /* Chart roles. Categorical slots validated against this white card surface:
     lightness band PASS, chroma floor PASS, worst adjacent CVD ΔE 9.1 (target ≥8),
     worst normal-vision ΔE well clear of the 15 floor. Slots 3–4 fall under 3:1
     contrast, so the mandatory relief ships: a visible label on every segment
     plus a full table view below the chart. */
  .viz{
    --surface-1:#ffffff;
    --series-1:#006ACC; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
    --pos:#0b7a40;   /* 5.42:1 on white */
    --neg:#b42318;   /* 6.57:1 on white */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--navy); color:var(--navy); font-family:"Montserrat","Segoe UI",Arial,sans-serif; }
  a{ color:inherit; }
  h1,h2,h3{ margin:0; }
  p{ margin:0; }
  .page{ max-width:1920px; margin:0 auto; background:var(--navy); }
  .skip-link{ position:absolute; left:-9999px; top:12px; background:#fff; color:var(--navy); font-size:14px; font-weight:600; padding:12px 20px; border-radius:999px; z-index:50; }
  .skip-link:focus{ left:24px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding:30px 56px; }

  /* EBS's signature under-nav accent, same stops as its own
     --gradient-ebs-under-nav-accent token. */
  .topbar{ position:relative; }
  .topbar::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(270deg,#001f4c 5.23%,var(--ebs-blue-mid) 48.88%,var(--ebs-mint) 91.17%);
  }
  .logo-img{ height:32px; width:auto; display:block; }
  .site-nav{ display:flex; align-items:center; gap:28px; }
  .nav-link{ color:#fff; text-decoration:none; font-size:16px; font-weight:600; }
  .nav-link:hover{ opacity:.85; }

  /* ---- Navigation feel: see the same block on the home page ---- */
  html{ scroll-behavior:smooth; }
  [id]{ scroll-margin-top:28px; }

  @view-transition{ navigation:auto; }
  .topbar{ view-transition-name:site-header; }
  ::view-transition-old(root),
  ::view-transition-new(root){ animation-duration:.26s; }

  .nav-link{ position:relative; }
  .nav-link::after{
    content:""; position:absolute; left:0; right:0; bottom:-7px; height:2px;
    background:var(--ebs-mint); border-radius:2px;
    transform:scaleX(0); transform-origin:left center;
    transition:transform .24s cubic-bezier(.4,0,.2,1);
  }
  .nav-link:hover::after,
  .nav-link:focus-visible::after{ transform:scaleX(1); }
  /* The page you are on keeps its underline, rather than dropping out of the nav. */
  .nav-link[aria-current="page"]{ opacity:1; }
  .nav-link[aria-current="page"]::after{ transform:scaleX(1); }
  .btn-join{ transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease; }
  .btn-join:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.22); }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .nav-link::after{ transition:none; }
    .btn-join:hover{ transform:none; }
    ::view-transition-group(*),
    ::view-transition-old(*),
    ::view-transition-new(*){ animation:none !important; }
  }
  .btn-join{ display:inline-flex; align-items:center; gap:8px; background:#fff; color:var(--navy); font-size:16px; font-weight:600; padding:12px 20px; border-radius:999px; text-decoration:none; }

  .hero-wrap{ padding:0 40px 40px; display:flow-root; }
  .hero{
    border-radius:22px; padding:60px 64px;
    background:
      radial-gradient(90% 120% at 93% 6%, rgba(115,235,199,.24) 0%, rgba(115,235,199,0) 55%),
      radial-gradient(120% 140% at 78% 18%, rgba(0,106,172,.62) 0%, rgba(0,106,172,0) 62%),
      linear-gradient(112deg,#001F4C 0%,#032a5c 55%,#063a74 100%);
  }
  .hero-eyebrow{ font-size:13px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--sky); margin:0 0 16px; }
  .hero h1{ font-family:"Zin Display Cond",Georgia,serif; font-weight:500; font-size:72px; line-height:1; color:#fff; text-transform:uppercase; margin:0 0 20px; }
  .hero p{ font-size:18px; line-height:1.55; color:#eef2fb; max-width:56ch; }

  .band{ background:var(--paper); padding:64px 64px 44px; }
  .band + .band{ padding-top:0; }
  .band-head{ max-width:780px; margin:0 0 26px; }
  .band-head h2{ font-family:"Zin Display Cond",Georgia,serif; font-weight:500; font-size:42px; line-height:1.02; text-transform:uppercase; margin:0 0 12px; }
  .band-head p{ font-size:16px; line-height:1.7; color:var(--body-soft); }
  .card{ background:var(--card); border-radius:22px; box-shadow:0 2px 10px rgba(16,38,90,.05); padding:38px 40px; }

  /* ---- Live status ---- */
  .status-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .status-pill{
    display:inline-flex; align-items:center; gap:9px; font-size:13px; font-weight:700;
    padding:8px 16px; border-radius:999px; background:var(--pill); color:var(--navy);
  }
  .status-dot{ width:9px; height:9px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .status-pill[data-state="live"]{ background:#e9f7ef; color:var(--pos); }
  .status-pill[data-state="live"] .status-dot{ background:var(--pos); animation:pulse 2s ease-in-out infinite; }
  .status-pill[data-state="loading"] .status-dot{ background:var(--accent); animation:pulse 1s ease-in-out infinite; }
  .status-pill[data-state="snapshot"]{ background:var(--warn-bg); color:var(--warn); }
  .status-pill[data-state="snapshot"] .status-dot{ background:var(--warn); }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @media (prefers-reduced-motion: reduce){ .status-dot{ animation:none !important; } }
  .btn-refresh{
    font:inherit; font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px;
    border:1.5px solid var(--navy); background:#fff; color:var(--navy); cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .btn-refresh:hover{ background:var(--navy); color:#fff; }
  .btn-refresh:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---- Headline figure ---- */
  .headline{ display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .headline-value{
    font-family:"Zin Display Cond",Georgia,serif; font-weight:500; font-size:60px; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .headline-delta{ font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .data.compact .detail{ display:none; }

  /* ---- Allocation bar ---- */
  /* ---- Per-holding weight bars ----
     The weight bar is the allocation chart now: one bar per holding, coloured
     by the exposure it belongs to. Every bar is accompanied by its figure and
     its exposure name in text, so colour never carries meaning on its own. */
  .wcol, .wcell{ min-width:170px; }
  .wbar{ display:block; height:8px; border-radius:4px; background:var(--pill); overflow:hidden; margin-bottom:6px; }
  .wbar > span{ display:block; height:100%; border-radius:4px; background:var(--c); }
  .wnum{ font-size:12.5px; color:var(--muted-strong); font-variant-numeric:tabular-nums; }
  .status-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  /* ---- Tables ---- */
  .table-wrap{
    overflow-x:auto; margin-top:24px; padding-top:22px;
    border-top:1px solid var(--accent-line);
  }
  table.data{ width:100%; border-collapse:collapse; font-size:15px; }
  table.data caption{ text-align:left; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-bottom:12px; }
  table.data th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; padding:0 14px 12px; border-bottom:1px solid var(--accent-line); white-space:nowrap; }
  table.data td{ padding:14px; border-bottom:1px solid var(--accent-line); color:var(--body-soft); }
  table.data tbody tr:last-child td{ border-bottom:none; }
  table.data tbody tr:nth-child(even){ background:var(--tint); }
  table.data tfoot td{ padding:16px 14px; border-top:2px solid var(--accent-line); font-weight:700; color:var(--navy); }
  .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .name-cell{ font-weight:700; color:var(--navy); }
  .sub{ display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin-top:3px; }
  /* The sign is in the text, so colour is never the only channel. */
  .delta-pos{ color:var(--pos); font-weight:700; }
  .delta-neg{ color:var(--neg); font-weight:700; }
  .fresh{ animation:flash 1.1s ease-out; }
  @keyframes flash{ 0%{ background:rgba(0,106,204,.14); } 100%{ background:transparent; } }
  @media (prefers-reduced-motion: reduce){ .fresh{ animation:none; } }

  /* ---- Strategy / disclaimer / footer ---- */
  .prose-grid{ display:grid; grid-template-columns:1.5fr 1fr; }
  .prose-col{ padding:42px 40px; }
  .prose-col h3{ font-family:"Zin Display Cond",Georgia,serif; font-weight:500; font-size:30px; text-transform:uppercase; margin:0 0 16px; }
  .prose-col p{ font-size:16px; line-height:1.7; color:var(--body-soft); margin:0 0 16px; }
  .side-col{ padding:42px 38px; border-left:1px solid var(--accent-line); background:var(--tint); border-radius:0 22px 22px 0; }
  .side-col h4{ font-size:13px; font-weight:700; color:var(--navy); margin:0 0 14px; }
  .step{ margin-bottom:16px; }
  .step-n{ font-family:"Zin Display Cond",Georgia,serif; font-size:23px; font-weight:500; color:var(--navy); line-height:1; }
  .step-t{ font-size:13.5px; color:var(--muted-strong); line-height:1.45; margin-top:4px; }

  .disclaimer{ background:var(--paper); padding:0 64px 60px; }
  .disclaimer-inner{ background:var(--navy); border-radius:22px; padding:34px 42px; color:#eef2fb; font-size:14.5px; line-height:1.65; }
  .disclaimer-inner strong{ color:#fff; }
  .footer{ background:var(--navy); padding:40px 56px 32px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .footer .logo-img{ height:28px; }
  .footer-email{ color:var(--footer-email); font-size:16px; font-weight:500; text-decoration:none; }

  @media (max-width:1100px){
    .topbar{ padding:22px 28px; }
    .hero-wrap{ padding:0 20px 28px; }
    .hero{ padding:44px 30px; }
    .hero h1{ font-size:50px; }
    .band, .disclaimer{ padding-left:32px; padding-right:32px; }
    .band{ padding-top:52px; }
    .card{ padding:30px 26px; }
    .prose-grid{ grid-template-columns:1fr; }
    .side-col{ border-left:none; border-top:1px solid var(--accent-line); border-radius:0 0 22px 22px; }
    .footer{ padding:32px 28px; }
  }
  @media (max-width:767px){
    .topbar{ padding:18px 20px; gap:14px; }
    .logo-img{ height:24px; }
    .site-nav{ gap:14px; }
    .nav-link{ font-size:15px; }
    .btn-join{ padding:10px 16px; font-size:15px; }
    .hero-wrap{ padding:0 16px 24px; }
    .hero{ border-radius:16px; padding:32px 22px; }
    .hero h1{ font-size:34px; }
    .band, .disclaimer{ padding-left:16px; padding-right:16px; }
    .band{ padding-top:38px; padding-bottom:26px; }
    .band-head h2{ font-size:30px; }
    .card{ padding:22px 18px; }
    .headline-value{ font-size:44px; }
    .prose-col, .side-col{ padding:26px 20px; }
    .disclaimer-inner{ padding:24px 20px; }
    .footer{ padding:26px 20px; flex-direction:column; align-items:flex-start; gap:14px; }
    .status-row{ gap:12px; }
    .btn-refresh{ width:100%; }
  }
</style>
</head>

<div class="page">

  <header class="topbar">
    <a class="logo-link" href="../">
      <img class="logo-img" src="../assets/ebsic-logo.svg" width="1489" height="431" alt="EBS Investment Club">
    </a>
    <nav class="site-nav">
      <a class="nav-link" href="../#teams">Teams</a>
      <a class="nav-link" href="./" aria-current="page">Portfolio</a>
      <a class="nav-link" href="../events/">Events</a>
      <a class="btn-join" href="https://forms.cloud.microsoft/e/5nPxMLS6NB" target="_blank" rel="noreferrer">Join us</a>
    </nav>

  <div class="hero-wrap">
    <section class="hero">
      <p class="hero-eyebrow">Portfolio Team</p>
      <h1>The club<br>portfolio</h1>
      <p>What the club owns, and how each holding is doing. Prices update while markets are
         open.</p>
    </section>
  </div>

  <main id="main" class="viz">

    <!-- ---------- Overview ---------- -->
    <section class="band">
      <div class="band-head">
        <h2>Where things<br>stand</h2>
      </div>
      <div class="card">
        <div class="status-row">
          <span class="status-pill" id="status-pill" data-state="loading">
            <span class="status-dot"></span><span id="status-text">Loading prices…</span>
          </span>
          <span class="status-actions">
            <button class="btn-refresh" id="detail-btn" type="button" aria-expanded="false">Show cost basis</button>
            <button class="btn-refresh" id="refresh-btn" type="button">Refresh</button>
          </span>

        <div class="headline" id="headline"></div>

        <div class="table-wrap">
          <table class="data compact" id="positions">

            <thead>
              <tr>
                <th scope="col">Holding</th>
                <th scope="col" class="wcol">Weight</th>
                <th scope="col" class="num detail">Qty</th>
                <th scope="col" class="num detail">Cost</th>

  </main>

  <footer class="footer">

    <a class="footer-email" href="mailto:investeerimisklubi@ebs.ee">investeerimisklubi@ebs.ee</a>
  </footer>

<script src="quotes-config.js"></script>
<script>
(function(){
  // ---------------------------------------------------------------------
  // HOLDINGS — quantity and cost basis come from the broker and do not change
  // on their own; only the price is fetched live. `snapshot` is the price shown
  // by the broker when this was recorded, and is what the page falls back to
  // when live quotes are unavailable.
  //
  // currency matters: GOOGL and the 5-share VUAA line are quoted in USD, so
  // their euro value depends on the FX rate. The other three are EUR-quoted.
  // ---------------------------------------------------------------------
  var AS_OF = "14 October 2026";
  // Back-solved from the broker's own figures so the fallback reconciles exactly:
  // 1925.25 / (6 × 359.22) and 671.82 / (5 × 150.42) both give this rate.
  var SNAPSHOT_FX = 0.893254;        // EUR per USD at the time of the snapshot

  // costEur is the euro cost basis as the broker records it, fixed at purchase.
  // It is NOT qty × cost × today's FX — on a USD line those differ, because the
  // basis was converted at the rate on the day it was bought.
  var POSITIONS = [
    { name: "Alphabet Inc.",                  ticker: "GOOGL", symbol: "GOOGL", exchange: "NASDAQ",
      qty: 6,  cost: 341.08, snapshot: 359.22, currency: "USD", costEur: 1828.00, group: "Single stock" },
    { name: "iShares NASDAQ-100 UCITS ETF",   ticker: "EXXT",  symbol: "EXXT",  exchange: "XETR",
      qty: 21, cost: 214.11, snapshot: 265.10, currency: "EUR", costEur: 4496.38, group: "Nasdaq-100" },
    { name: "Vanguard S&P 500 UCITS ETF",     ticker: "VUAA",  symbol: "VUAA",  exchange: "XETR",
      qty: 40, cost: 103.37, snapshot: 135.18, currency: "EUR", costEur: 4134.95, group: "S&P 500" },
    { name: "Vanguard S&P 500 UCITS ETF",     ticker: "VUAA",  symbol: "VUAA",  exchange: "LSE",
      qty: 5,  cost: 122.24, snapshot: 150.42, currency: "USD", costEur:  545.96, group: "S&P 500" },
    // LHV shows this as DX2X; by ISIN LU0328475792 it is the Xtrackers STOXX
    // Europe 600 1C, which quote providers list as XSX6. Confirm before publishing.
    { name: "Xtrackers STOXX Europe 600 1C",  ticker: "DX2X",  symbol: "XSX6",  exchange: "XETR",
      qty: 7,  cost: 139.10, snapshot: 165.22, currency: "EUR", costEur:  973.70, group: "Europe 600" }
  ];

  var SERIES = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)"];
  var cfg = window.IC_QUOTES || null;

  var state = { fx: SNAPSHOT_FX, live: false, updated: null, note: "" };

  // ---- helpers --------------------------------------------------------
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  var nf = function(n, d){
    return Number(n).toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
  };
  function eur(n){ return nf(n, 2) + " €"; }
  function signed(n, d, suffix){
    var s = n >= 0 ? "+" : "−";
    return s + nf(Math.abs(n), d) + (suffix || "");
  }
  function price(p){ return p.live != null ? p.live : p.snapshot; }
  function rate(p){ return p.currency === "USD" ? state.fx : 1; }
  function valueEur(p){ return p.qty * price(p) * rate(p); }
  function costEur(p){ return p.costEur; }
  function profitEur(p){ return valueEur(p) - p.costEur; }

  // Totals add up the figures as displayed, not the unrounded ones, so the
  // column visibly sums to the total the way the broker's statement does.
  function round2(n){ return Math.round(n * 100) / 100; }
  function totals(){
    var value = 0, profit = 0, cost = 0;
    POSITIONS.forEach(function(p){
      value  += round2(valueEur(p));
      profit += round2(profitEur(p));
      cost   += round2(p.costEur);
    });
    return { value: round2(value), profit: round2(profit), cost: cost, ret: profit / cost * 100 };
  }
  function changePct(p){ return (price(p) - p.cost) / p.cost * 100; }

  // ---- rendering ------------------------------------------------------
  function renderHeadline(){
    var t = totals();
    var cls = t.profit >= 0 ? "delta-pos" : "delta-neg";
    document.getElementById("headline").innerHTML =
      '<span class="headline-value">' + eur(t.value) + '</span>' +
      '<span class="headline-delta ' + cls + '">' + signed(t.ret, 2, "%") + " \u00B7 " +
        signed(t.profit, 2, " \u20AC") + '</span>';
  }

  var GROUP_COLOUR = {};

  // Each holding's weight bar is coloured by the exposure it belongs to, so the
  // two VUAA lines read as one S&P 500 position. The grouping is still named in
  // text on every row, so the colour is reinforcement, not the only signal.
  function assignGroupColours(){
    var groups = {};
    POSITIONS.forEach(function(p){ groups[p.group] = (groups[p.group] || 0) + valueEur(p); });
    var order = Object.keys(groups).sort(function(a,b){ return groups[b] - groups[a]; });
    GROUP_COLOUR = {};
    order.forEach(function(name,i){ GROUP_COLOUR[name] = SERIES[i % SERIES.length]; });
  }

  var showDetail = false;

  function renderPositions(changedTickers){
    changedTickers = changedTickers || {};
    var t = totals();
    // Biggest holding first: this list doubles as the allocation chart, so it
    // should read top-down like one.
    var rows = POSITIONS.slice().sort(function(a,b){ return valueEur(b) - valueEur(a); });

    document.getElementById("positions-table").innerHTML = rows.map(function(p){
      var chg = changePct(p), prof = profitEur(p), val = valueEur(p);
      var w = t.value ? val / t.value * 100 : 0;
      var key = p.symbol + ":" + p.exchange;
      return '<tr' + (changedTickers[key] ? ' class="fresh"' : '') + '>' +
        '<td class="name-cell">' + esc(p.name) +
          '<span class="sub">' + esc(p.ticker) + ' \u00B7 ' + esc(p.exchange) +
          (p.currency === "USD" ? " \u00B7 USD, converted" : "") + '</span></td>' +
        '<td class="wcell">' +
          '<span class="wbar" aria-hidden="true"><span style="width:' + w.toFixed(2) +
            '%; --c:' + (GROUP_COLOUR[p.group] || SERIES[0]) + '"></span></span>' +
          '<span class="wnum">' + nf(w,1) + '% \u00B7 ' + esc(p.group) + '</span></td>' +
        '<td class="num detail">' + p.qty + '</td>' +
        '<td class="num detail">' + nf(p.cost,2) + '</td>' +
        '<td class="num detail">' + nf(price(p),2) + '</td>' +
        '<td class="num ' + (chg >= 0 ? "delta-pos" : "delta-neg") + '">' + signed(chg,2,"%") + '</td>' +
        '<td class="num detail ' + (prof >= 0 ? "delta-pos" : "delta-neg") + '">' + signed(prof,2," \u20AC") + '</td>' +
        '<td class="num">' + eur(val) + '</td></tr>';
    }).join("");

    document.getElementById("positions-foot").innerHTML =
      '<tr><td colspan="' + (showDetail ? 5 : 2) + '">Total</td>' +
      '<td class="num ' + (t.profit >= 0 ? "delta-pos" : "delta-neg") + '">' + signed(t.ret,2,"%") + '</td>' +
      '<td class="num detail ' + (t.profit >= 0 ? "delta-pos" : "delta-neg") + '">' + signed(t.profit,2," \u20AC") + '</td>' +
      '<td class="num">' + eur(t.value) + '</td></tr>';
  }

  function setStatus(stateName, text, note){
    var pill = document.getElementById("status-pill");
    pill.setAttribute("data-state", stateName);
    document.getElementById("status-text").textContent = text;
    // The detail (where prices came from, the FX rate, how to enable live
    // updates) is kept on the pill as a tooltip instead of a line of technical
    // copy on the page. The pill's own text still names the state.
    if (note) pill.setAttribute("title", note); else pill.removeAttribute("title");
  }

  function renderAll(changed){
    renderHeadline();
    assignGroupColours();
    renderPositions(changed);
  }

  // ---- live data ------------------------------------------------------
  // No free API serves these European ETF listings straight to a browser:
  // Boerse Frankfurt answers "403 Invalid CORS request" as soon as an Origin
  // header is present, and Yahoo sends no CORS header at all. So prices come
  // from one of three places, tried in order:
  //   1. prices.json   — written by refresh-prices.py, same-origin, needs no key
  //   2. Twelve Data   — true in-browser live, needs a free key in quotes-config.js
  //   3. the broker snapshot baked into POSITIONS
  // The FX rate is always fetched from Frankfurter, which is keyless and does
  // send CORS, so euro values track today's rate even with no other source.
  function fetchJson(url){
    return fetch(url, { cache: "no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function key(p){ return p.symbol + ":" + p.exchange; }

  // Frankfurt quotes every instrument in euros, including the two lines whose
  // home listing is in dollars. Convert back to the position's own currency so
  // "since entry" stays a like-for-like comparison with the price actually paid,
  // exactly as the broker reports it.
  function applyQuote(p, price, currency){
    var native = price;
    if (currency && currency !== p.currency){
      native = (currency === "EUR" && p.currency === "USD") ? price / state.fx : price * state.fx;
    }
    var changed = p.live !== native;
    p.live = native;
    return changed;
  }

  function fetchFx(){
    return fetchJson("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR")
      .then(function(d){
        var r = parseFloat(d && d.rates && d.rates.EUR);
        if (isFinite(r)){ state.fx = r; state.fxLive = true; }
      })
      .catch(function(){ /* keep the snapshot rate */ });
  }

  function loadLocalPrices(){
    return fetchJson("prices.json?t=" + Date.now()).then(function(d){
      if (!d || !d.quotes) return null;
      var fxLocal = parseFloat(d.fxUsdEur);
      if (isFinite(fxLocal) && !state.fxLive) state.fx = fxLocal;
      var changed = {}, n = 0;
      POSITIONS.forEach(function(p){
        var q = d.quotes[key(p)];
        if (q && isFinite(parseFloat(q.price))){
          if (applyQuote(p, parseFloat(q.price), q.currency)) changed[key(p)] = true;
          n++;
        }
      });
      return n ? { source: "local", n: n, changed: changed, updated: d.updated } : null;
    }).catch(function(){ return null; });
  }

  function fetchTwelveData(){
    if (!cfg || !cfg.apiKey || cfg.apiKey === "YOUR_TWELVE_DATA_KEY") return Promise.resolve(null);
    var base = "https://api.twelvedata.com", k = encodeURIComponent(cfg.apiKey);
    return Promise.all(POSITIONS.map(function(p){
      return fetchJson(base + "/quote?symbol=" + encodeURIComponent(p.symbol) +
                       "&exchange=" + encodeURIComponent(p.exchange) + "&apikey=" + k)
        .then(function(d){
          var v = parseFloat(d && d.close);
          return { p: p, price: isFinite(v) ? v : null, err: d && d.message ? d.message : null };
        })
        .catch(function(e){ return { p: p, price: null, err: e.message }; });
    })).then(function(rs){
      var changed = {}, n = 0, err = null;
      rs.forEach(function(r){
        if (r.price != null){
          if (applyQuote(r.p, r.price, r.p.currency)) changed[key(r.p)] = true;
          n++;
        } else if (!err){ err = r.err; }
      });
      return n ? { source: "twelvedata", n: n, changed: changed, err: err } : null;
    }).catch(function(){ return null; });
  }

  function report(res){
    state.source = (res && res.source) || "snapshot";
    var fxNote = state.fxLive
      ? "USD lines converted at " + nf(state.fx, 5) + " EUR/USD (ECB reference rate, live)."
      : "USD lines converted at the recorded rate " + nf(state.fx, 5) + " EUR/USD.";

    if (res && res.source === "local"){
      var when = res.updated ? new Date(res.updated) : null;
      var stamp = when ? when.toLocaleString(undefined, { hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }) : "";
      setStatus(res.n === POSITIONS.length ? "live" : "snapshot",
        "Prices from " + stamp,
        "Fetched by refresh-prices.py from Boerse Frankfurt, which publishes quotes about 15 minutes delayed. No API key needed. Run it with --watch to keep it updating. " + fxNote);
    } else if (res && res.source === "twelvedata"){
      var now = new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      setStatus(res.n === POSITIONS.length ? "live" : "snapshot",
        "Live · updated " + now,
        "Prices from Twelve Data, possibly delayed up to 15 minutes. " + fxNote +
        (res.err ? " Some instruments fell back to the snapshot: " + res.err : ""));
    } else {
      // Nothing live: revert to the recorded rate too. Frozen prices with a
      // current FX rate would be neither one thing nor the other, and would
      // stop the page reconciling with the broker statement it came from.
      state.fx = SNAPSHOT_FX;
      state.fxLive = false;
      setStatus("snapshot", "Broker snapshot · " + AS_OF,
        "No live prices yet. Run `python3 refresh-prices.py` in this folder for keyless prices, " +
        "or add a Twelve Data key to quotes-config.js for in-browser updates. " +
        "Figures are exactly as the broker recorded them, FX included.");
    }
    renderAll(res && res.changed);
  }

  function refresh(){
    var btn = document.getElementById("refresh-btn");
    btn.disabled = true;
    setStatus("loading", "Fetching prices…", "");
    return fetchFx()
      .then(loadLocalPrices)
      .then(function(local){ return local || fetchTwelveData(); })
      .then(report)
      .catch(function(){ report(null); })
      .then(function(){ btn.disabled = false; });
  }


  function init(){
    renderAll();                 // snapshot first, so the page is never empty
    document.getElementById("detail-btn").addEventListener("click", function(){
      showDetail = !showDetail;
      document.getElementById("positions").classList.toggle("compact", !showDetail);
      this.textContent = showDetail ? "Hide cost basis" : "Show cost basis";
      this.setAttribute("aria-expanded", showDetail ? "true" : "false");
      renderPositions();
    });
    document.getElementById("refresh-btn").addEventListener("click", refresh);
    refresh().then(schedule);

    // prices.json is same-origin and unmetered, so poll it often; a provider
    // with a request quota gets the slower cadence instead.
    function schedule(){
      var ms = (state.source === "local") ? 60000 : ((cfg && cfg.refreshMs) || 300000);
      setTimeout(function(){
        if (document.visibilityState === "visible") refresh().then(schedule);
        else schedule();
      }, ms);
    }
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
